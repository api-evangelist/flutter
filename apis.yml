name: Flutter
description: >-
  Flutter was an early-stage gesture-recognition startup founded in 2010 by Mehul
  Nariyawala and Navneet Dalal and based in California. Its consumer app used
  computer-vision hand-gesture recognition over a built-in webcam to control media
  players such as iTunes, Spotify, VLC, and QuickTime; it launched in 2012, reached
  number one free app in dozens of countries on the Mac App Store, and was named by
  Apple among the best free apps of 2012. The company raised early funding from Y
  Combinator, Andreessen Horowitz (a16z), and NEA before Google acquired it on
  October 2, 2013, after which the product was discontinued. It has no active
  developer program, public API, or maintained developer portal today. This profile
  is retained as a historical portfolio-lead record; there is no live provider
  surface to enrich.
